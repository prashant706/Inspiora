<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - My Website</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
/* Contact Page Custom Styles */
body {font-family: Arial, sans-serif; margin:0; padding:0; line-height:1.6;}
header, footer {background:var(--dark-color); color:#fff; padding:20px 0;}
header h1, footer p {margin:0;}
nav ul {display:flex; list-style:none; padding:0;}
nav ul li {margin-right:20px;}
nav ul li a {color:#fff; text-decoration:none; font-weight:bold;}
.hero-section {background:#ff6b00; color:#fff; text-align:center; padding:80px 20px;}
.hero-section h2 {font-size:3rem; margin-bottom:10px;}
.hero-section p {font-size:1.2rem;}
.container {width:90%; max-width:1200px; margin:0 auto;}
.section {padding:60px 0;}
.section h2 {text-align:center; font-size:2.5rem; margin-bottom:20px;}
.section p.subtitle {text-align:center; margin-bottom:40px; color:#555; font-size:1.1rem;}
form {max-width:600px; margin:0 auto; background:#f9f9f9; padding:30px; border-radius:10px;}
form .form-group {margin-bottom:20px;}
form input, form textarea {width:100%; padding:12px; border-radius:5px; border:1px solid #ccc; font-size:1rem;}
form textarea {resize:none; height:120px;}
.submit-button {background:#ff6b00; color:#fff; padding:12px 30px; border:none; border-radius:5px; cursor:pointer; font-size:1rem; transition:0.3s;}
.submit-button:hover {background:#ff3d00;}
</style>
</head>
<body>

<header>
<div class="container">
<h1>Inspiora</h1>
<nav>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="services.html">Services</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>
</div>
</header>

<main>
<section class="hero-section">
<h2>Contact Us</h2>
<p>Have questions or want to start a project? Reach out to us!</p>
</section>

<section class="section">
<div class="container">
<h2>Send a Message</h2>
<p class="subtitle">Fill out the form below and we'll get back to you as soon as possible</p>
<form action="https://formsubmit.co/aanya.singh2638@gmail.com" method="POST">
<div class="form-group">
<input type="text" name="name" placeholder="Your Name" required>
</div>
<div class="form-group">
<input type="email" name="email" placeholder="Your Email" required>
</div>
<div class="form-group">
<input type="text" name="phone" placeholder="Phone Number" required>
</div>
<div class="form-group">
<textarea name="message" placeholder="Your Message" required></textarea>
</div>
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_next" value="https://yourthankyouwebsite.netlify.app/">
<button type="submit" class="submit-button">Submit</button>
</form>
</div>
</section>

</main>

<footer>
<div class="container">
<p>&copy; 2023 My Website. All rights reserved.</p>
</div>
</footer>

</body>
</html>
