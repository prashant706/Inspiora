<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.png" type="image/png">
    <title>Inspiora</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

      <section>
                  <!-- Login Modal -->
        <div id="login-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2>Login</h2>
                <form action="https://formsubmit.co/aanya.singh2638@gmail.com" method="POST" id="login-form">
                    <div class="form-group">
                        <input type="email" name="email" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="phonenumber" placeholder="Phone Number" required>
                    </div>
                    <div class="form-group">
                        <input type="password" name="password" placeholder="Password" required>
                    </div>
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_next" value="https://yourthankyouwebsite.netlify.app/">
                    <input type="hidden" name="_template" value="table">
                    <button type="submit" class="submit-button">Login</button>
                    <p class="form-footer">Don't have an account? <a href="#" id="show-register">Register</a></p>
                </form>
            </div>
        </div>

        <!-- Register Modal -->
        <div id="register-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2>Register</h2>
                <form action="https://formsubmit.co/aanya.singh2638@gmail.com" method="POST" id="register-form">
                    <div class="form-group">
                        <input type="text" name="name" placeholder="Full Name"required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="phonenumber" placeholder="Phone Number" required>
                    </div>
                    <div class="form-group">
                        <input type="password"  name="password" placeholder="Password">
                    </div>
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_next" id="nextPage">
                    <input type="hidden" name="_template" value="table">
                    <button type="submit" class="submit-button">Register</button>
                    <p class="form-footer">Already have an account? <a href="#" id="show-login">Login</a></p>
                </form>

                <script>
                    // Redirect ko automatic success page pe set karega
                     document.getElementById("nextPage").value = window.location.origin + "/success.html";
                </script>
            </div>
        </div>
      </section>

    </body>
</html>
